spring.datasource.url=jdbc:h2:mem:lanacash-public;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.platform=h2
app.affiliation.document-validator.enabled=${APP_AFFILIATION_DOCUMENT_VALIDATOR_ENABLED:true}
app.affiliation.document-validator.base-url=${APP_AFFILIATION_DOCUMENT_VALIDATOR_BASE_URL:http://127.0.0.1:9001}
app.affiliation.document-validator.api-key=${APP_AFFILIATION_DOCUMENT_VALIDATOR_API_KEY:}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
