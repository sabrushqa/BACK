spring.application.name=demo
server.port=8000

# Durcissement du cookie de session (spring-session-jdbc) en defense en profondeur :
# l'API elle-meme est stateless (JWT via header Authorization, cf. SecurityConfiguration),
# mais si un cookie de session est tout de meme emis, il doit rester inutilisable en JS,
# n'etre transmis qu'en HTTPS, et ne jamais partir sur une requete cross-site.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Charge les secrets Google Calendar locaux en développement, que le backend
# soit lancé depuis le module demo/ ou depuis la racine du workspace.
spring.config.import=optional:file:.env.google-calendar.local[.properties],optional:file:demo/.env.google-calendar.local[.properties],optional:file:.env.microsoft-calendar.local[.properties],optional:file:demo/.env.microsoft-calendar.local[.properties]

# V-12 : token partagé avec le chatbot FastAPI pour authentifier les appels internes
# Doit être défini via la variable d'environnement CHATBOT_INTERNAL_TOKEN (aucune valeur par défaut)
app.chatbot.internal-token=${CHATBOT_INTERNAL_TOKEN}

# Token attendu par le chatbot FastAPI pour les appels sortants du backend (proxy /api/merchant/chatbot/**)
# Ne doit jamais etre expose au frontend (contrairement a l'ancien VITE_CHATBOT_TOKEN)
app.chatbot.base-url=${APP_CHATBOT_BASE_URL:http://127.0.0.1:9000}
app.chatbot.token=${APP_CHATBOT_TOKEN}

# switch-monetique-service : source de verite du stock TPE (voir tpe-monetique-simulator/)
app.switch-monetique.base-url=${APP_SWITCH_MONETIQUE_BASE_URL:http://localhost:8090}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433 ;databaseName=lanatest;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.platform=sqlserver
app.affiliation.upload-dir=uploads/affiliations
app.affiliation.document-validator.enabled=${APP_AFFILIATION_DOCUMENT_VALIDATOR_ENABLED:true}
app.affiliation.document-validator.base-url=${APP_AFFILIATION_DOCUMENT_VALIDATOR_BASE_URL:http://127.0.0.1:9001}
app.affiliation.chrome-pdf.enabled=${APP_AFFILIATION_CHROME_PDF_ENABLED:true}
app.affiliation.chrome-pdf.executable=${APP_AFFILIATION_CHROME_PDF_EXECUTABLE:C:/Program Files (x86)/Google/Chrome/Application/chrome.exe}
app.upload.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:250MB}
app.upload.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:1GB}
app.upload.max-multipart-parts=${APP_UPLOAD_MAX_MULTIPART_PARTS:-1}
app.frontend.base-url=http://localhost:4200
# Synchronisation des relances avec le calendrier Google du commercial.
# GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY doit être une clé AES de 32 octets encodée en Base64.
app.google-calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
app.google-calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
app.google-calendar.token-encryption-key=${GOOGLE_CALENDAR_TOKEN_ENCRYPTION_KEY:}
app.google-calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:}
# Synchronisation des relances avec Outlook Calendar via Microsoft Graph.
# MICROSOFT_CALENDAR_TOKEN_ENCRYPTION_KEY doit être une clé AES de 32 octets encodée en Base64.
app.microsoft-calendar.client-id=${MICROSOFT_CALENDAR_CLIENT_ID:}
app.microsoft-calendar.client-secret=${MICROSOFT_CALENDAR_CLIENT_SECRET:}
app.microsoft-calendar.token-encryption-key=${MICROSOFT_CALENDAR_TOKEN_ENCRYPTION_KEY:}
app.microsoft-calendar.redirect-uri=${MICROSOFT_CALENDAR_REDIRECT_URI:}
app.auth.activation-expiration-minutes=60
app.supervisor.bootstrap.enabled=${APP_SUPERVISOR_BOOTSTRAP_ENABLED:true}
app.supervisor.bootstrap.email=${APP_SUPERVISOR_BOOTSTRAP_EMAIL:Superviseur_portail@lanacash.ma}
app.demo.staff-seed.enabled=${APP_DEMO_STAFF_SEED_ENABLED:true}
app.demo.affiliation-seed.enabled=${APP_DEMO_AFFILIATION_SEED_ENABLED:true}
app.demo.affiliation-seed.count=${APP_DEMO_AFFILIATION_SEED_COUNT:30}
app.auth.jwt.secret=${APP_JWT_SECRET}
app.auth.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:15}
app.auth.otp.expiration-minutes=${APP_OTP_EXPIRATION_MINUTES:5}
app.auth.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:5}
app.auth.password-reset.expiration-minutes=${APP_PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.auth.password-reset.max-attempts=${APP_PASSWORD_RESET_MAX_ATTEMPTS:5}
app.auth.otp.dev-preview-enabled=${APP_OTP_DEV_PREVIEW_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/PFE26}
app.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8088}
app.keycloak.realm=${KEYCLOAK_REALM:PFE26}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID:portail-affiliation}
app.keycloak.client.redirect-uris=${KEYCLOAK_CLIENT_REDIRECT_URIS:http://localhost:3000/*,http://localhost:4200/*,http://localhost:4300/*}
app.keycloak.client.web-origins=${KEYCLOAK_CLIENT_WEB_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:4300}
app.keycloak.admin.enabled=${KEYCLOAK_ADMIN_ENABLED:true}
app.keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:master}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
app.keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
app.keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
app.keycloak.otp.required=${KEYCLOAK_OTP_REQUIRED:true}
spring.servlet.multipart.max-file-size=${app.upload.max-file-size}
spring.servlet.multipart.max-request-size=${app.upload.max-request-size}
server.tomcat.max-http-form-post-size=${app.upload.max-request-size}
server.tomcat.max-swallow-size=${app.upload.max-request-size}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.keycloak.smtp.from=${APP_KEYCLOAK_SMTP_FROM}
app.keycloak.smtp.from-display-name=${APP_KEYCLOAK_SMTP_FROM_DISPLAY_NAME:Lana Cash}
app.keycloak.smtp.reply-to=${APP_KEYCLOAK_SMTP_REPLY_TO:}
